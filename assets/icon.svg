<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Pueblo Restaurant Radar icon">
  <title>Pueblo Restaurant Radar</title>
  <circle cx="50" cy="50" r="50" fill="#07090e"/>
  <!-- Radar rings -->
  <circle cx="50" cy="50" r="14" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.35"/>
  <circle cx="50" cy="50" r="26" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.25"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.18"/>
  <!-- Cross hairs -->
  <line x1="50" y1="6" x2="50" y2="94" stroke="#f59e0b" stroke-width="0.8" opacity="0.2"/>
  <line x1="6" y1="50" x2="94" y2="50" stroke="#f59e0b" stroke-width="0.8" opacity="0.2"/>
  <!-- Sweep line (pointing ~45deg) -->
  <line x1="50" y1="50" x2="85" y2="18" stroke="#f59e0b" stroke-width="2" opacity="0.9" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="4" fill="#f59e0b"/>
  <!-- Blip near sweep tip -->
  <circle cx="78" cy="26" r="3.5" fill="#f59e0b" opacity="0.95"/>
  <!-- Secondary blip -->
  <circle cx="34" cy="30" r="2" fill="#f59e0b" opacity="0.6"/>
</svg>
